
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Extract project ZIP
        run: unzip -o UsbBrowser-Final-CloudBuild.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Fix libaums dependency version
        working-directory: usbfinal
        run: |
          grep -RIl 'me.jahnen.libaums:core:0.9.0' app --include='*.gradle' --include='*.gradle.kts' | xargs -r sed -i 's/me.jahnen.libaums:core:0.9.0/me.jahnen.libaums:core:0.9.4/g'

      - name: Build APK
        run: gradle --no-daemon -p usbfinal clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: UsbBrowser-debug-apk
          path: usbfinal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
